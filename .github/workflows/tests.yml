name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Everything, GUI adapter included. The GUI needs Qt 6.5 or newer, which
  # Ubuntu runners do not ship, so this runs in Arch, close to the machine
  # the app is developed on.
  full:
    name: Core, CLI and GUI (Arch)
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 20
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed git gcc make cmake pkgconf \
            curl openssl nlohmann-json libzip qt6-base qt6-declarative

      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

  # Core and CLI with no Qt installed at all: fails if anything under
  # src/core/ starts depending on Qt (rule 1 in AGENTS.md).
  core:
    name: Core and CLI without Qt (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ pkg-config \
            libcurl4-openssl-dev libssl-dev nlohmann-json3-dev libzip-dev

      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -DWAM_BUILD_GUI=OFF

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure
